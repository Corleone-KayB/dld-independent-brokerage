services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dld_partners
    ports:
      - "5432:5432"
    volumes:
      - dld_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dld_partners"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dld_postgres_data:
